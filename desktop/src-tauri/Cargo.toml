[package]
name = "ai-meeting-desktop"
version = "0.1.0"
description = "Local-only meeting transcriber, Vietnamese-first"
authors = ["Tien Tran"]
edition = "2021"
rust-version = "1.82"

[lib]
# `staticlib`/`cdylib` are what the mobile targets link against; `rlib` is what
# main.rs and the integration tests use.
name = "ai_meeting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
regex = "1"
dirs = "6"
# Blocking HTTP for model downloads. Chosen over reqwest because the only need
# is "stream a big file with a progress callback" on a worker thread — no async
# runtime, no TLS stack duplication.
ureq = "3"
# Microphone capture. The system-audio side is macOS-only and lives below.
cpal = "0.18"
# Local-time transcript stamps (`YYYYMMDD-HHMMSS`); std has no local timezone.
chrono = { version = "0.4", features = ["clock"] }

# The engine. Metal is what replaces MLX on Apple silicon: same Whisper weights,
# decoded on the GPU instead of fp32 on the CPU. CoreML is deliberately left off
# — it needs a separate per-model `.mlmodelc` download to be worth anything.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# Intel Macs, Linux and Windows get the CPU build. Users who want CUDA or Vulkan
# can add the feature themselves; defaulting to it would break the build for
# everyone without the SDK installed.
[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = { version = "0.16" }

[dev-dependencies]
tempfile = "3"

[features]
# Tauri's own default; nothing custom yet.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# System-audio capture (the "Meeting" side). Preferred over meetily's git-pinned
# `cidre` because it is published, widely used, and scoped to exactly this job.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "2.1"
